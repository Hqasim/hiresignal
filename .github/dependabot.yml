# Weekly, grouped dependency updates (SPEC §15). Majors arrive as separate PRs so each one
# gets its own review; minors and patches are batched.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node 24 runtime (.nvmrc, Lambda nodejs24.x); move with the runtime.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
