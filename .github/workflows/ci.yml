# Quality gates for every pull request and every push to main (SPEC §15).
# CI never receives GEMINI_API_KEY: anything that talks to an LLM runs in replay mode.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality (format, lint, types, boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run depcruise

  unit:
    name: Unit tests (coverage gates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Upload API coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 7
          if-no-files-found: error

  integration:
    name: Integration tests (Postgres + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The same image as docker-compose.yml, so CI and local runs see the same Postgres and pgvector.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: hiresignal
          POSTGRES_PASSWORD: hiresignal
          POSTGRES_DB: hiresignal
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hiresignal -d hiresignal"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Throwaway credentials for the service container only.
      DATABASE_MIGRATION_URL: postgres://hiresignal:hiresignal@localhost:5433/hiresignal
      TEST_DATABASE_URL: postgres://hiresignal:hiresignal@localhost:5433/hiresignal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply migrations with the CLI the deploy uses
        run: npm run db:migrate
      - name: Run them again to prove the runner is idempotent
        run: npm run db:migrate
      - run: npm run test:integration

  evals:
    name: Evals (replay, gated)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: hiresignal
          POSTGRES_PASSWORD: hiresignal
          POSTGRES_DB: hiresignal
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hiresignal -d hiresignal"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The example's database URLs match the service container, and its model IDs match the
      # committed fixtures, which replay keys include (SPEC §9.8).
      - name: Use the example environment (replay, service container)
        run: cp .env.example .env
      - run: npm run db:migrate
      - name: Seed from the fixtures (replay)
        run: npm run seed
      # Exits 1 when a gate in apps/api/evals/thresholds.ts fails; the tables go to the job summary.
      - name: Run the eval suites against their gates
        run: npm run eval

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    # Above the config's 10-minute globalTimeout, so Playwright stops first and still writes its report.
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: hiresignal
          POSTGRES_PASSWORD: hiresignal
          POSTGRES_DB: hiresignal
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hiresignal -d hiresignal"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The example's database URLs match the service container, and its model IDs match the
      # committed fixtures, which replay keys include (SPEC §9.8).
      - name: Use the example environment (replay, service container)
        run: cp .env.example .env
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      # Playwright seeds in replay, then starts the API (LLM_MODE=replay) and the built web app.
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: error

  build:
    name: Build (API bundle, web, SAM templates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke-test the Lambda bundle with a Function URL event
        run: npm run smoke:bundle -w @hiresignal/api
      - uses: aws-actions/setup-sam@v3
        with:
          version: 1.167.0
          use-installer: true
      - name: Lint SAM templates
        run: |
          sam validate --lint --region us-east-1 --template-file infra/template.yaml
          sam validate --lint --region us-east-1 --template-file infra/bootstrap.yaml
